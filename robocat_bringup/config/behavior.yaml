mode_manager_node:
  ros__parameters:
    default_mode: "cat"
    default_submode: "default"
    events_topic: "/vision/events"
    command_topic: "/robot/command"
    mode_topic: "/robot/mode"
    movement_topic: "/robocat/cmd"
    oled_anim_topic: "/oled_anim"
    oled_text_topic: "/oled_text"
    audio_emotion_topic: "/audio/emotion"
    audio_say_topic: "/audio/say"
    min_repeat_sec: 1.0
    event_hold_sec: 2.0
    actions_enabled: false

behavior_node:
  ros__parameters:
    mode_topic: "/robot/mode"
    events_topic: "/vision/events"
    movement_topic: "/robocat/cmd"
    oled_anim_topic: "/oled_anim"
    oled_anim_state_topic: "/oled_anim_state"
    oled_text_topic: "/oled_text"
    audio_emotion_topic: "/audio/emotion"
    audio_play_file_topic: "/audio/play_file"
    happy_sing_enabled: true
    happy_sing_probability: 0.25
    happy_sing_cooldown_sec: 90.0
    happy_song_files: ["Neon_Guardian.wav", "Neon_Prowler.wav", "Robocat_on_Patrol.wav"]
    min_repeat_sec: 1.0
    event_anim_hold_sec: 0.0
    cat_idle_anim: "default"
    city_idle_anim: "city"
    police_idle_anim: "patrol"
    city_container_anim: "city"
    city_container_play_file: "Robocat_on_Patrol.wav"
    police_detect_anim: "patrol"
    plate_similarity_threshold: 0.85
    plate_max_history: 5
